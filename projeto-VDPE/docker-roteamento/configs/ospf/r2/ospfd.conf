! ospfd.conf - R2
hostname R2
password zebra
!
interface eth1
 ip ospf network point-to-point
!
interface eth2
 ip ospf network point-to-point
!
interface eth3
 ip ospf network point-to-point
!
router ospf
 ospf router-id 2.2.2.2
 passive-interface eth0
 network 10.2.0.0/24 area 0
 network 10.0.12.0/29 area 0
 network 10.0.24.0/29 area 0
 network 10.0.23.0/29 area 0
!
line vty
!
